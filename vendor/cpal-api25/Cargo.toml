[package]
name = "cpal"
version = "0.15.3"
edition = "2021"
rust-version = "1.70"
license = "Apache-2.0"
repository = "https://github.com/RustAudio/cpal"
readme = "README.md"

[features]
asio = []
jack = []
wasm-bindgen = []
oboe-shared-stdcxx = ["oboe/shared-stdcxx"]

[dependencies]
dasp_sample = "0.11"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk = { version = "0.8", default-features = false }
ndk-context = "0.1"
oboe = { version = "0.6", features = ["java-interface"] }

[lints.rust]
unsafe_code = "allow"
